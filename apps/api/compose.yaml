services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewnal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-brewnal}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-brewnal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: apps/api/dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - 3001:3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
