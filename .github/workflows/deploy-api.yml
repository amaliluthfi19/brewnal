name: API CI

# Deployment is handled by Railway's GitHub integration (config: apps/api/railway.json).
# With "Wait for CI" enabled on the Railway service, a deploy only starts after this passes.

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api type-check
      - run: pnpm --filter api build
